name: Trigger auto deployment for serviceapi

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/serviceapi-AutoDeployTrigger-331d5f75-e909-48d6-b876-d3d3f06fbbbf.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SERVICEAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SERVICEAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SERVICEAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/ProductMicroservice
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: prductservice.azurecr.io
          registryUsername: ${{ secrets.SERVICEAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SERVICEAPI_REGISTRY_PASSWORD }}
          containerAppName: serviceapi
          resourceGroup: ms
          imageToBuild: prductservice.azurecr.io/serviceapi:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


